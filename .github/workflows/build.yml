name: build-dylib

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成 JS 头文件
        run: |
          xxd -i src/cx-core.js | sed 's/src_cx_core_js/cx_core_js/g' > src/cx-core.js.h
          head -3 src/cx-core.js.h

      - name: 编译 dylib
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -O2 \
            -miphoneos-version-min=15.0 -fobjc-arc -Isrc \
            -framework Foundation -framework UIKit -framework WebKit \
            -framework QuartzCore -framework CoreGraphics -framework Security \
            -install_name @executable_path/Frameworks/CXExamAI.dylib \
            -o CXExamAI.dylib src/*.m
          ls -lh CXExamAI.dylib
          file CXExamAI.dylib

      - name: 签名
        run: |
          brew install ldid >/dev/null 2>&1 || true
          ldid -S CXExamAI.dylib || echo "ldid 失败，TrollFools 注入时会重新签名"

      - name: 发布 Release（避开 artifact 配额）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o 'CX_VERSION @"[0-9.]*"' src/CXCommon.h | grep -o '[0-9][0-9.]*')
          TAG="v${VER}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" CXExamAI.dylib \
            --repo "$GITHUB_REPOSITORY" \
            --title "CXExamAI ${TAG}" \
            --notes "commit ${GITHUB_SHA:0:7} / $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "下载：https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/CXExamAI.dylib"

